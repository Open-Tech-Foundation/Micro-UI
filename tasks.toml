# tasks.toml — workspace root anchor and config for `tsr` (https://tsr.opentechf.org)
# Run any task from anywhere in the repo: `tsr <task> [-- <passthrough>]`
# Inspect without executing: `tsr <task> --dry-run`  •  List: `tsr --list`  •  Edit: `tsr --config`

[workspace]
members = ["packages/*", "demo", "website"]

# ------------------------------------------------------------------ demo
# Live demo workbench — `esdev start` defaults to http://localhost:5173
[tasks.demo]
run = "esdev start"
dir = "demo"

# Public marketing site — `tsr website` starts the OTF Web dev server.
[tasks.website]
run = "otfw dev"
dir = "website"

# Static build of the marketing site. Not part of `build` (that ships the npm
# package); needed by `test:website:e2e`, which drives the built docs pages in
# a real browser. `dist/` is git-ignored.
[tasks."website:build"]
run = "otfw build --ssg"
dir = "website"

# ------------------------------------------------------------------ build
[tasks.build]
deps = ["build:types", "build:js", "build:js:min", "build:css", "build:css:min", "build:css:parts", "build:readme"]

[tasks."build:types"]
run = "esdev build --lib src --dts-bundle=src/index.ts && rm -f dist/dom.js dist/reconcile.js dist/vdom.js dist/template.js dist/define.js dist/update.js dist/store.js dist/html.js dist/mount.js dist/lifecycle.js dist/error.js dist/state.js dist/raw.js dist/ns.js dist/types.js dist/index.js"
dir = "packages/micro-ui"

[tasks."build:js"]
run = "esdev build src/index.ts --out=dist/index.js"
dir = "packages/micro-ui"

[tasks."build:js:min"]
run = "esdev build src/index.ts --out=dist/index.min.js --minify"
dir = "packages/micro-ui"

[tasks."build:css"]
run = "esdev build src/styles.css --out=dist/styles.css"
dir = "packages/micro-ui"

[tasks."build:css:min"]
run = "esdev build src/styles.css --out=dist/styles.min.css --minify"
dir = "packages/micro-ui"

# The split partials the README documents. Without these, importing
# @opentf/micro-ui/styles/tokens.css resolves to nothing: only the bundle ships.
# Each partial has no further @imports, so a direct CSS entry is a passthrough
# (byte-identical); the bundle above is where esdev follows the @imports.
[tasks."build:css:parts"]
run = """mkdir -p dist/styles \
&& esdev build src/styles/tokens.css     --out=dist/styles/tokens.css \
&& esdev build src/styles/base.css       --out=dist/styles/base.css \
&& esdev build src/styles/components.css --out=dist/styles/components.css \
&& esdev build src/styles/tokens.css     --out=dist/styles/tokens.min.css --minify \
&& esdev build src/styles/base.css       --out=dist/styles/base.min.css --minify \
&& esdev build src/styles/components.css --out=dist/styles/components.min.css --minify"""
dir = "packages/micro-ui"

[tasks."build:readme"]
run = "cp ../../README.md README.md && sed -i 's#(./packages/micro-ui/docs/css-utils.md)#(./docs/css-utils.md)#' README.md && sed -i '/Micro-UI Screenshot/d' README.md"
dir = "packages/micro-ui"

# ------------------------------------------------------------------ typecheck / test
[tasks.typecheck]
packages = ["packages/*"]
run = "tsc --noEmit"

# The whole DOM suite runs natively under esdev (`esdev test --dom`) against a
# real DOM — no jsdom and no harness. It runs from the repo root (no `dir`) so
# the filesystem jail covers the monorepo README and tasks.toml too.
[tasks.test]
run = "esdev test --dom packages/micro-ui/test/dom"

# The split-math suite lives beside its source and is pure logic, so it runs
# without the DOM flag. Nothing else in demo/ has tests.
[tasks."test:demo"]
run = "esdev test"
dir = "demo"

# The website content suite — static checks against the marketing sources, so
# plain `esdev test` with no DOM flag. The browser-driven docs check below is
# a node script (like `test:browser`), not an esdev file, so it is never
# picked up here.
[tasks."test:website"]
run = "esdev test"
dir = "website"

# The docs sidebar check drives the built site through CDP in whatever
# chromium or chrome is installed. It covers what static checks cannot — the
# sidebar actually staying pinned while the page scrolls — and skips with a
# message when the machine has no browser or `website/dist/` has not been
# built, so `check` still passes without either. Like `test:browser` it is an
# esdev-run driver script, not an esdev test file: the assertions run inside a
# real browser, where layout and scrolling exist.
[tasks."test:website:e2e"]
deps = ["website:build"]
run = "esdev test/docs-sidebar.e2e.mjs"
dir = "website"

# test.html, driven through CDP in whatever chromium or chrome is installed.
# It covers what the DOM suite cannot model — real paint, real scrolling, real
# media — and skips with a message when the machine has no browser, so `check`
# still passes without one. Needs dist/, which is what test.html imports.
# Runs from the repo root (no `dir`): the filesystem jail follows the working
# directory, and test.html lives at the root while dist/ lives in packages/.
[tasks."test:browser"]
deps = ["build:js"]
run = "esdev packages/micro-ui/test/browser/run.mjs"

# ------------------------------------------------------------------ lint / fmt (Biome)
[tasks.lint]
run = "biome lint"

[tasks.fmt]
run = "biome format --write"

[tasks."fmt:check"]
run = "biome check"

# ------------------------------------------------------------------ ci
[tasks.check]
deps = ["typecheck", "lint", "fmt:check", "test", "test:demo", "test:website", "test:browser"]

[tasks.ci]
deps = ["check", "build"]
