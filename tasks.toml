# tasks.toml — workspace root anchor and config for `tsr` (https://tsr.opentechf.org)
# Run any task from anywhere in the repo: `tsr <task> [-- <passthrough>]`
# Inspect without executing: `tsr <task> --dry-run`  •  List: `tsr --list`  •  Edit: `tsr --config`

[workspace]
members = ["packages/*", "demo"]

# ------------------------------------------------------------------ demo
# Live demo workbench — `esdev start` defaults to http://localhost:5173
[tasks.demo]
run = "esdev start"
dir = "demo"

# ------------------------------------------------------------------ build
[tasks.build]
deps = ["build:lib", "build:lib:min", "build:css", "build:css:min", "build:readme"]

[tasks."build:lib"]
run = "esdev build --lib src --dts-bundle=src/index.ts"
dir = "packages/micro-ui"

[tasks."build:lib:min"]
run = "esdev build --lib src --no-types --minify --out=dist/min"
dir = "packages/micro-ui"

[tasks."build:css"]
run = "cp src/styles.css dist/styles.css && mkdir -p dist/styles && cp src/styles/* dist/styles/"
dir = "packages/micro-ui"

[tasks."build:css:min"]
run = "npx lightningcss-cli --minify --bundle src/styles.css -o dist/styles.min.css && npx lightningcss-cli --minify src/styles/base.css -o dist/styles/base.min.css && npx lightningcss-cli --minify src/styles/tokens.css -o dist/styles/tokens.min.css && npx lightningcss-cli --minify src/styles/components.css -o dist/styles/components.min.css"
dir = "packages/micro-ui"

[tasks."build:readme"]
run = "cp ../../README.md README.md && sed -i 's#(./packages/micro-ui/docs/css-utils.md)#(./docs/css-utils.md)#' README.md && sed -i '/Micro-UI Screenshot/d' README.md"
dir = "packages/micro-ui"

# ------------------------------------------------------------------ typecheck / test
[tasks.typecheck]
packages = ["packages/*"]
run = "tsc --noEmit"

# Tests run from the workspace root (not the package dir) so esdev's module
# sandbox — which pins resolution to the process working directory — can reach
# pnpm's hoisted store under root node_modules/.pnpm. The trailing path
# segment excludes test/jsdom/ which runs under a different runtime.
[tasks.test]
run = "esdev test packages/micro-ui/test/micro-ui"

[tasks."test:e2e"]
run = "esdev test packages/micro-ui/test/micro-ui.e2e"

# jsdom tests run under bun (native TypeScript, real DOM).
[tasks."test:jsdom"]
run = "bun test test/jsdom/*.test.mjs"
dir = "packages/micro-ui"

# ------------------------------------------------------------------ lint / fmt (Biome)
[tasks.lint]
run = "biome lint"

[tasks.fmt]
run = "biome format --write"

[tasks."fmt:check"]
run = "biome check"

# ------------------------------------------------------------------ ci
[tasks.check]
deps = ["typecheck", "lint", "fmt:check", "test", "test:jsdom"]

[tasks.ci]
deps = ["check", "build"]
