# tasks.toml — workspace root anchor and config for `tsr` (https://tsr.opentechf.org)
# Run any task from anywhere in the repo: `tsr <task> [-- <passthrough>]`
# Inspect without executing: `tsr <task> --dry-run`  •  List: `tsr --list`  •  Edit: `tsr --config`

[workspace]
members = ["packages/*", "demo"]

# ------------------------------------------------------------------ demo
# Live demo workbench — `esdev start` defaults to http://localhost:5173
[tasks.demo]
run = "esdev start"
dir = "demo"

# ------------------------------------------------------------------ build
[tasks.build]
deps = ["build:types", "build:js", "build:js:min", "build:css", "build:css:min", "build:readme"]

[tasks."build:types"]
run = "esdev build --lib src --dts-bundle=src/index.ts && rm -f dist/dom.js dist/reconcile.js dist/vdom.js dist/template.js dist/define.js dist/update.js dist/store.js dist/html.js dist/mount.js dist/lifecycle.js dist/error.js dist/state.js dist/escape.js dist/raw.js dist/ns.js dist/types.js dist/index.js"
dir = "packages/micro-ui"

[tasks."build:js"]
run = "esdev build src/index.ts --out=dist/index.js"
dir = "packages/micro-ui"

[tasks."build:js:min"]
run = "esdev build src/index.ts --out=dist/index.min.js --minify"
dir = "packages/micro-ui"

[tasks."build:css"]
run = "lightningcss --bundle src/styles.css -o dist/styles.css"
dir = "packages/micro-ui"

[tasks."build:css:min"]
run = "lightningcss --minify --bundle src/styles.css -o dist/styles.min.css"
dir = "packages/micro-ui"

[tasks."build:readme"]
run = "cp ../../README.md README.md && sed -i 's#(./packages/micro-ui/docs/css-utils.md)#(./docs/css-utils.md)#' README.md && sed -i '/Micro-UI Screenshot/d' README.md"
dir = "packages/micro-ui"

# ------------------------------------------------------------------ typecheck / test
[tasks.typecheck]
packages = ["packages/*"]
run = "tsc --noEmit"

# jsdom tests (bun, real DOM via jsdom)
[tasks.test]
run = "bun test test/jsdom/*.test.mjs"
dir = "packages/micro-ui"

[tasks."test:jsdom"]
run = "bun test test/jsdom/*.test.mjs"
dir = "packages/micro-ui"

# ------------------------------------------------------------------ lint / fmt (Biome)
[tasks.lint]
run = "biome lint"

[tasks.fmt]
run = "biome format --write"

[tasks."fmt:check"]
run = "biome check"

# ------------------------------------------------------------------ ci
[tasks.check]
deps = ["typecheck", "lint", "fmt:check", "test", "test:jsdom"]

[tasks.ci]
deps = ["check", "build"]
