# tasks.toml — workspace root anchor and config for `tsr` (https://tsr.opentechf.org)
# Run any task from anywhere in the repo: `tsr <task> [-- <passthrough>]`
# Inspect without executing: `tsr <task> --dry-run`  •  List: `tsr --list`  •  Edit: `tsr --config`

[workspace]
members = ["packages/*", "demo"]

# ------------------------------------------------------------------ demo
# Live demo workbench — `esdev start` defaults to http://localhost:5173
[tasks.demo]
run = "esdev start"
dir = "demo"

# ------------------------------------------------------------------ build
[tasks.build]
deps = ["build:types", "build:js", "build:js:min", "build:css", "build:css:min", "build:css:parts", "build:readme"]

[tasks."build:types"]
run = "esdev build --lib src --dts-bundle=src/index.ts && rm -f dist/dom.js dist/reconcile.js dist/vdom.js dist/template.js dist/define.js dist/update.js dist/store.js dist/html.js dist/mount.js dist/lifecycle.js dist/error.js dist/state.js dist/raw.js dist/ns.js dist/types.js dist/index.js"
dir = "packages/micro-ui"

[tasks."build:js"]
run = "esdev build src/index.ts --out=dist/index.js"
dir = "packages/micro-ui"

[tasks."build:js:min"]
run = "esdev build src/index.ts --out=dist/index.min.js --minify"
dir = "packages/micro-ui"

[tasks."build:css"]
run = "lightningcss --bundle src/styles.css -o dist/styles.css"
dir = "packages/micro-ui"

[tasks."build:css:min"]
run = "lightningcss --minify --bundle src/styles.css -o dist/styles.min.css"
dir = "packages/micro-ui"

# The split partials the README documents. Without these, importing
# @opentf/micro-ui/styles/tokens.css resolves to nothing: only the bundle ships.
[tasks."build:css:parts"]
run = """mkdir -p dist/styles \
&& lightningcss --bundle src/styles/tokens.css     -o dist/styles/tokens.css \
&& lightningcss --bundle src/styles/base.css       -o dist/styles/base.css \
&& lightningcss --bundle src/styles/components.css -o dist/styles/components.css \
&& lightningcss --minify --bundle src/styles/tokens.css     -o dist/styles/tokens.min.css \
&& lightningcss --minify --bundle src/styles/base.css       -o dist/styles/base.min.css \
&& lightningcss --minify --bundle src/styles/components.css -o dist/styles/components.min.css"""
dir = "packages/micro-ui"

[tasks."build:readme"]
run = "cp ../../README.md README.md && sed -i 's#(./packages/micro-ui/docs/css-utils.md)#(./docs/css-utils.md)#' README.md && sed -i '/Micro-UI Screenshot/d' README.md"
dir = "packages/micro-ui"

# ------------------------------------------------------------------ typecheck / test
[tasks.typecheck]
packages = ["packages/*"]
run = "tsc --noEmit"

# The whole suite runs under bun against a real DOM via jsdom. There is only
# one suite — the FakeDOM harness it used to share this task with is gone.
[tasks.test]
run = "bun test test/jsdom/*.test.mjs"
dir = "packages/micro-ui"

# test.html, driven through CDP in whatever chromium or chrome is installed.
# It covers what jsdom cannot model — real paint, real scrolling, real media —
# and skips with a message when the machine has no browser, so `check` still
# passes without one. Needs dist/, which is what test.html imports.
[tasks."test:browser"]
deps = ["build:js"]
run = "bun test/browser/run.mjs"
dir = "packages/micro-ui"

# ------------------------------------------------------------------ lint / fmt (Biome)
[tasks.lint]
run = "biome lint"

[tasks.fmt]
run = "biome format --write"

[tasks."fmt:check"]
run = "biome check"

# ------------------------------------------------------------------ ci
[tasks.check]
deps = ["typecheck", "lint", "fmt:check", "test", "test:browser"]

[tasks.ci]
deps = ["check", "build"]
